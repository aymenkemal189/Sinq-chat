<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Delivery Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; direction: rtl; text-align: right; }
        .container { max-width: 450px; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #1b5e20; text-align: center; font-size: 24px; }
        .card { border: 1px solid #eee; padding: 15px; border-radius: 12px; margin-bottom: 15px; background: #fafafa; }
        label { font-weight: bold; color: #444; }
        select, input { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; transition: 0.3s; }
        select:focus, input:focus { border-color: #2e7d32; outline: none; }
        .price-summary { background: #e8f5e9; padding: 15px; border-radius: 10px; border-right: 6px solid #2e7d32; }
        .btn-location { background: #1976d2; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .btn-order { background: #2e7d32; color: white; border: none; width: 100%; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 10px rgba(46, 125, 50, 0.3); }
        .status { color: #666; font-size: 13px; text-align: center; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌿 ስንቅ የጫት አድራሽ</h2>
        
        <div class="card">
            <label>መሸጫ እና አይነት</label>
            <select id="shop">
                <option value="ሚስባህ ጫት ቤት">ሚስባህ ጫት ቤት</option>
                <option value="ሰይድ ጫት ቤት">ሰይድ ጫት ቤት</option>
                <option value="ዳውድ ጫት ቤት">ዳውድ ጫት ቤት</option>
                <option value="አረጋሽ ጫት ቤት">አረጋሽ ጫት ቤት</option>
            </select>
            <select id="type">
                <option value="በቀላ">በቀላ</option>
                <option value="ኖርማል">ኖርማል</option>
                <option value="ኦንላይን">ኦንላይን</option>
                <option value="ፍርፍር">ፍርፍር</option>
            </select>
            <input type="number" id="basePrice" placeholder="የጫት ዋጋ በብር" oninput="calculate()">
        </div>

        <div class="card">
            <label>አድራሻ (Location)</label>
            <button class="btn-location" onclick="getLocation()">📍 ያለሁበትን ቦታ ላክ</button>
            <div id="locationStatus" class="status">ቦታ አልተመረጠም</div>
            <input type="number" id="distance" placeholder="ርቀት በኪሜ (ካርታው ያሰላዋል)" oninput="calculate()">
        </div>

        <div class="price-summary">
            <div>የአገልግሎት ክፍያ (30%): <span id="serviceFee">0</span> ብር</div>
            <div>የርቀት ክፍያ (ከ2ኪሜ በላይ): <span id="distFee">0</span> ብር</div>
            <hr>
            <div style="font-weight:bold; font-size:1.3em; color:#1b5e20;">ጠቅላላ ሂሳብ: <span id="total">0</span> ብር</div>
        </div>

        <button class="btn-order" onclick="submitOrder()">አሁን እዘዝ</button>
    </div>

    <script>
        let userLocation = null;

        function getLocation() {
            if (navigator.geolocation) {
                document.getElementById('locationStatus').innerText = "በመፈለግ ላይ...";
                navigator.geolocation.getCurrentPosition((position) => {
                    userLocation = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    document.getElementById('locationStatus').innerText = "✅ ቦታ ተገኝቷል!";
                    // ለሙከራ ርቀቱን 3 ኪሜ እናድርገው (በእውነተኛ ካርታ እንዲሰላ ማድረግ ይቻላል)
                    document.getElementById('distance').value = 3; 
                    calculate();
                });
            }
        }

        function calculate() {
            let price = parseFloat(document.getElementById('basePrice').value) || 0;
            let dist = parseFloat(document.getElementById('distance').value) || 0;
            
            let sFee = price * 0.30;
            let dFee = 0;
            
            if (dist > 2) {
                // ከ 2 ኪሜ በላይ ለእያንዳንዱ ኪሜ 20 ብር
                dFee = (dist - 2) * 20;
            }
            
            document.getElementById('serviceFee').innerText = sFee.toFixed(2);
            document.getElementById('distFee').innerText = dFee.toFixed(2);
            document.getElementById('total').innerText = (price + sFee + dFee).toFixed(2);
        }

        function submitOrder() {
            const tg = window.Telegram.WebApp;
            const data = {
                shop: document.getElementById('shop').value,
                type: document.getElementById('type').value,
                total: document.getElementById('total').innerText,
                location: userLocation
            };
            tg.sendData(JSON.stringify(data)); // መረጃውን ለቦቱ ይልካል
            tg.close();
        }
    </script>
</body>
</html>
