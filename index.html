<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snq Delivery</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --primary: #2e7d32; --vip: #ffc107; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding: 15px; direction: rtl; text-align: right; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: var(--primary); margin-bottom: 20px; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; border-radius: 10px; font-weight: bold; background: #eee; transition: 0.3s; }
        .tab.active { background: var(--primary); color: white; }
        .tab.vip-active { background: var(--vip); color: black; }

        .card { background: #fafafa; border: 1px solid #eee; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #444; }
        input[type="text"], input[type="tel"], input[type="number"], select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        
        .extra-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .extra-item { display: flex; align-items: center; gap: 5px; font-size: 14px; }
        
        .btn-loc { background: #0288d1; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 5px; }
        .loc-status { font-size: 13px; color: #666; text-align: center; }

        .summary { background: #e8f5e9; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 18px; text-align: center; margin-top: 15px; }
        .btn-submit { background: var(--primary); color: white; border: none; width: 100%; padding: 18px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🌿 ሲንቅ ማድረሻ</h2>

    <div class="tabs">
        <div id="normTab" class="tab active" onclick="setMode('normal')">መደበኛ (30%)</div>
        <div id="vipTab" class="tab" onclick="setMode('vip')">👑 VIP (50%)</div>
    </div>

    <div class="card">
        <label>የደንበኛ መረጃ</label>
        <input type="text" id="fname" placeholder="ሙሉ ስም">
        <input type="tel" id="phone" placeholder="ስልክ ቁጥር (09...)">
    </div>

    <div class="card">
        <label>የጫት ትዕዛዝ</label>
        <select id="shop">
            <option value="ሚስባህ ጫት ቤት">ሚስባህ ጫት ቤት</option>
            <option value="ሰይድ ጫት ቤት">ሰይድ ጫት ቤት</option>
            <option value="ዳውድ ጫት ቤት">ዳውድ ጫት ቤት</option>
            <option value="አረጋሽ ጫት ቤት">አረጋሽ ጫት ቤት</option>
        </select>
        <select id="type">
            <option value="በቀላ">በቀላ</option>
            <option value="ኖርማል">ኖርማል</option>
            <option value="ኦንላይን">ኦንላይን</option>
            <option value="ፍርፍር">ፍርፍር</option>
        </select>
        <input type="number" id="price" placeholder="የጫት ዋጋ በብር" oninput="calc()">
    </div>

    <div class="card">
        <label>ተጨማሪዎች (Extras)</label>
        <div class="extra-grid">
            <label class="extra-item"><input type="checkbox" class="ext" value="30" onchange="calc()"> ለውዝ 30 ብር</label>
            <label class="extra-item"><input type="checkbox" class="ext" value="50" onchange="calc()"> ለውዝ 50 ብር</label>
            <label class="extra-item"><input type="checkbox" class="ext" value="40" onchange="calc()"> ውሃ 1 ሊትር (40)</label>
            <label class="extra-item"><input type="checkbox" class="ext" value="50" onchange="calc()"> ውሃ 2 ሊትር (50)</label>
        </div>
    </div>

    <div class="card">
        <label>ማብራሪያ (Description)</label>
        <textarea id="desc" rows="2" placeholder="ልዩ ትዕዛዝ ካለዎት እዚህ ይጻፉ..."></textarea>
    </div>

    <div class="card">
        <label>አድራሻ (Location)</label>
        <button class="btn-loc" onclick="getLoc()">📍 ያለሁበትን ቦታ አግኝ</button>
        <div id="locStatus" class="loc-status">ቦታ አልተመረጠም</div>
    </div>

    <div class="summary">
        ጠቅላላ ሂሳብ: <span id="total">0</span> ብር
    </div>

    <button class="btn-submit" onclick="submitOrder()">አሁኑኑ እዘዝ</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    let mode = 'normal';
    let userLoc = { lat: 0, lng: 0 };

    function setMode(m) {
        mode = m;
        document.getElementById('normTab').className = m === 'normal' ? 'tab active' : 'tab';
        document.getElementById('vipTab').className = m === 'vip' ? 'tab vip-active' : 'tab';
        calc();
    }

    function getLoc() {
        if (navigator.geolocation) {
            document.getElementById('locStatus').innerText = "በመፈለግ ላይ...";
            navigator.geolocation.getCurrentPosition(
                pos => {
                    userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    document.getElementById('locStatus').innerHTML = "✅ <b>ቦታ ተገኝቷል!</b>";
                    document.getElementById('locStatus').style.color = "green";
                },
                err => {
                    document.getElementById('locStatus').innerText = "❌ ሎኬሽን አልተፈቀደም";
                    document.getElementById('locStatus').style.color = "red";
                }
            );
        }
    }

    function calc() {
        let base = parseFloat(document.getElementById('price').value) || 0;
        let percent = mode === 'vip' ? 0.50 : 0.30;
        let extTotal = 0;
        
        document.querySelectorAll('.ext:checked').forEach(el => extTotal += parseFloat(el.value));
        
        let total = base + (base * percent) + extTotal;
        document.getElementById('total').innerText = total.toFixed(2);
    }

    function submitOrder() {
        let fname = document.getElementById('fname').value;
        let phone = document.getElementById('phone').value;

        if (!fname || !phone) {
            alert("እባክዎ ስም እና ስልክ ቁጥር ያስገቡ!");
            return;
        }

        let extrasList = [];
        document.querySelectorAll('.ext:checked').forEach(el => {
            extrasList.push(el.parentElement.innerText.trim());
        });

        const data = {
            mode: mode,
            name: fname,
            phone: phone,
            shop: document.getElementById('shop').value,
            type: document.getElementById('type').value,
            extras: extrasList.length > 0 ? extrasList.join(" | ") : "የለም",
            desc: document.getElementById('desc').value || "የለም",
            total: document.getElementById('total').innerText,
            location: userLoc
        };

        // መረጃውን ለቦቱ መላክ እና ዌብሳይቱን መዝጋት
        tg.sendData(JSON.stringify(data));
        tg.close();
    }
</script>
</body>
</html>
